name: Editor build

# E6-S1. The reusable half of the editor CI: provisioning, configure, build,
# and test for all three desktop platforms in one matrix. E2-S3 stood the three
# platforms up as three hand-written jobs whose steps had drifted into near
# duplicates; this is the same work expressed once, callable by any workflow
# that needs a built editor.
#
# E6-S2 (per-OS deploy artifacts) and E6-S3 (tagged releases) are meant to call
# this rather than restate the provisioning, which is what "reusable" buys.

on:
  workflow_call:
    inputs:
      build-type:
        description: 'CMake configuration to build and test.'
        type: string
        default: Release
      upload-artifacts:
        description: >-
          E6-S2. Deploy a self-contained package per platform and upload it.
          On by default: this project needs a runnable build for manual
          acceptance constantly, and staging those by hand is what E6-S2
          exists to stop.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # These were three independent jobs before E6-S1, so one platform failing
      # never hid the other two. A matrix cancels its siblings by default, which
      # would lose exactly the information a three-OS matrix exists to give.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # An AppImage runs only on a glibc at least as new as the one it
            # was built against. Built on ubuntu-26.04 it demanded GLIBC_2.43
            # and ran nowhere but ubuntu-26.04. The oldest base still offered
            # is the most portable one, and it is why SDL is built from source
            # below: nothing this old packages SDL3.
            os: ubuntu-22.04
            qt-arch: linux_gcc_64
            generator-args: '-G Ninja'
          - name: macOS
            os: macos-15-intel
            qt-arch: clang_64
            generator-args: '-G Ninja'
          - name: Windows
            os: windows-2022
            qt-arch: win64_msvc2022_64
            # Durable E2 state: plain Ninja without an initialized MSVC
            # environment lets CMake select MinGW and windres, which cannot
            # consume the UTF-16 TrackEditor.rc. Do not unpin this generator
            # without CI evidence.
            generator-args: '-G "Visual Studio 17 2022" -A x64'
            # E5-S3. Windows is the platform whose /W4 output has been read end
            # to end, so it is the one that enforces. Linux and macOS build at
            # the same raised level and print their warnings; flip them to
            # errors once a run has confirmed those logs are clean.
            extra-configure-args: '-DTRACKEDITOR_WARNINGS_AS_ERRORS=ON'
    env:
      HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install binary dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libudev-dev

      # No distro old enough to be a sensible AppImage base packages SDL3, so
      # it is built once and cached against the pinned versions.
      - name: Cache SDL
        if: runner.os == 'Linux'
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl
          key: sdl-${{ matrix.os }}-${{ hashFiles('scripts/install-sdl-linux.sh') }}

      - name: Build SDL from source (Linux)
        if: runner.os == 'Linux'
        run: |
          prefix="$(bash scripts/install-sdl-linux.sh "$RUNNER_TEMP/sdl")"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install binary dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install --force-bottle sdl3 sdl3_image ninja

      - name: Install dynamic Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          cache: true

      # Windows has no system package manager for SDL; the script downloads the
      # official development archives and verifies their SHA-256 hashes.
      - name: Install prebuilt SDL development packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-sdl-windows.ps1 -Destination "$env:RUNNER_TEMP\sdl"

      # bash on all three so the generator argument quotes read the same way.
      # CMAKE_BUILD_TYPE is ignored by the multi-config Visual Studio generator
      # and --config is ignored by single-config Ninja, so one pair of commands
      # covers both without branching.
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          ${{ matrix.generator-args }}
          -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}
          ${{ matrix.extra-configure-args }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ inputs.build-type }} --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C ${{ inputs.build-type }} --output-on-failure

      # E6-S2. Each platform's own deploy tool bundles dynamic Qt beside the
      # binary, so the artifact runs on a machine with no Qt and nothing on
      # PATH. install-qt-action exports QT_ROOT_DIR, which is where all three
      # tools live.
      - name: Deploy (Windows)
        if: inputs.upload-artifacts && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'dist/TrackEditor'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/TrackEditor/${{ inputs.build-type }}/TrackEditor.exe" $stage
          # --no-opengl-sw keeps the deployment honest about E5-S2: the viewport
          # is a plain QWidget blitting a QImage and links no Qt OpenGL.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
              --no-compiler-runtime `
              "$stage\TrackEditor.exe"
          # SDL has no system package manager here; take the DLLs from the
          # archives scripts/install-sdl-windows.ps1 unpacked.
          #
          # Take them from lib\x64 explicitly. The archives ship arm64, x64, and
          # x86 copies of each DLL, so a recursive glob finds all three, copies
          # them over each other in one flat directory, and leaves whichever
          # sorted last -- x86. A 64-bit exe beside a 32-bit SDL3.dll starts
          # with 0xc000007b and nothing else looks wrong.
          Get-ChildItem -Path "$env:RUNNER_TEMP\sdl" -Recurse -Include SDL3.dll, SDL3_image.dll |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              ForEach-Object { Copy-Item $_.FullName $stage }

          # Assert it rather than assume it: read the PE machine field of every
          # binary staged. This is cheap and it is exactly the check that was
          # missing when the mismatch above shipped.
          $wrong = Get-ChildItem $stage -Recurse -Include *.exe, *.dll | Where-Object {
              $stream = [IO.File]::OpenRead($_.FullName)
              try {
                  $reader = New-Object IO.BinaryReader($stream)
                  $stream.Position = 0x3C
                  $stream.Position = $reader.ReadInt32() + 4
                  $reader.ReadUInt16() -ne 0x8664   # IMAGE_FILE_MACHINE_AMD64
              } finally { $stream.Close() }
          }
          if ($wrong) {
              throw "not x64: $($wrong.Name -join ', ')"
          }
          Write-Host "$((Get-ChildItem $stage -Recurse -Include *.exe, *.dll).Count) staged binaries, all x64"

          # Then actually run it, with only the system directories on PATH.
          # "Self-contained" is a claim about a directory nobody had executed:
          # the build tree's smoke test passes using SDL from PATH, so it says
          # nothing about what was staged here. This is the check that was
          # missing, and it catches a wrong architecture, a DLL windeployqt did
          # not bring, and a missing platform plugin alike.
          #
          # Start-Process -Wait rather than the call operator: TrackEditor is a
          # GUI-subsystem binary, so `&` returns immediately and leaves
          # $LASTEXITCODE unset, which would make this check pass no matter
          # what. A loader failure like 0xc000007b is reported as the exit code
          # of the process, so it has to be waited for to be seen.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $smoke = Start-Process -FilePath "$stage\TrackEditor.exe" `
              -ArgumentList '--cmake-smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
              throw ("the staged artifact does not run standalone (exit 0x{0:X8})" -f $smoke.ExitCode)
          }
          Write-Host "staged artifact runs with only the system PATH"

      - name: Deploy (macOS)
        if: inputs.upload-artifacts && runner.os == 'macOS'
        run: |
          set -euo pipefail
          "$QT_ROOT_DIR/bin/macdeployqt" build/TrackEditor/TrackEditor.app
          mkdir -p dist
          # Tar rather than hand the .app to upload-artifact directly: the
          # framework symlinks inside a bundle do not survive being zipped.
          tar czf dist/TrackEditor-macOS.tar.gz -C build/TrackEditor TrackEditor.app

      - name: Deploy (Linux)
        if: inputs.upload-artifacts && runner.os == 'Linux'
        env:
          # The runners have no FUSE, so the AppImage tools have to unpack
          # themselves instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          plugin=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$plugin/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # linuxdeploy resolves --plugin qt by finding linuxdeploy-plugin-qt
          # on PATH.
          export PATH="$PWD:$PATH"
          # linuxdeploy keys the icon on its filename, which has to match the
          # desktop file's Icon= entry.
          cp TrackEditor/images/stunt.png trackeditor.png
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT=TrackEditor-x86_64.AppImage
          ./linuxdeploy --appdir AppDir \
            --executable build/TrackEditor/TrackEditor \
            --desktop-file packaging/trackeditor.desktop \
            --icon-file trackeditor.png \
            --plugin qt --output appimage
          mkdir -p dist
          mv TrackEditor-x86_64.AppImage dist/

          # Report the glibc floor the AppImage inherited from this runner. It
          # is the number that decides where the thing will actually run, and
          # it was invisible until an artifact failed to start.
          echo "highest glibc symbol required:"
          objdump -T AppDir/usr/bin/TrackEditor \
            | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -3

          # Then run it, the same way the Windows deploy runs what it staged.
          # A deploy tool reporting success says nothing about whether the
          # result starts.
          QT_QPA_PLATFORM=offscreen ./dist/TrackEditor-x86_64.AppImage --cmake-smoke-test
          echo "AppImage runs"

      - name: Describe the artifact
        if: inputs.upload-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "TrackEditor - ${{ matrix.name }} ${{ inputs.build-type }} build"
            echo
            echo "Commit:  ${GITHUB_SHA}"
            echo "Branch:  ${GITHUB_REF_NAME}"
            echo "Qt:      6.8.3 dynamic, bundled beside the binary"
            echo
            case "${{ runner.os }}" in
              Windows) echo "Run TrackEditor\\TrackEditor.exe. Needs nothing on PATH."
                       echo "Requires the Microsoft Visual C++ 2015-2022 redistributable,"
                       echo "which SDL3 also depends on and most Windows machines have." ;;
              macOS)   echo "tar xzf TrackEditor-macOS.tar.gz, then open TrackEditor.app."
                       echo "It is unsigned, so the first launch needs right-click > Open." ;;
              Linux)   echo "chmod +x TrackEditor-x86_64.AppImage and run it." ;;
            esac
          } > dist/READ-ME-FIRST.txt
          if [ -z "$(find dist -mindepth 1 ! -name READ-ME-FIRST.txt -print -quit)" ]; then
            echo "::error::the deploy step produced no payload" >&2
            exit 1
          fi
          ls -R dist

      - name: Upload the artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrackEditor-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          # Manual acceptance happens within days of a build, not months.
          retention-days: 14
