name: Build

# E6-S1. The PR gate is a thin caller; everything it does lives in the reusable
# editor-build workflow so that E6-S2 and E6-S3 can reuse it rather than restate
# the provisioning.

on:
  push:
  pull_request:
  # E6-S3. Nightly. Every dependency this build has moves without us -- runner
  # images, apt, Homebrew bottles, the Qt action, linuxdeploy's rolling
  # release -- so a scheduled run is what distinguishes "the toolchain drifted"
  # from "our change broke it". Off the hour, as GitHub asks.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  editor:
    name: Editor
    uses: ./.github/workflows/editor-build.yml
